name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy SDK package "tools" was removed from Google's repository.
          packages: platform-tools

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install signing key
        env:
          ALOUD_STORE_B64: ${{ secrets.ALOUD_STORE_B64 }}
          ALOUD_STORE_PASSWORD: ${{ secrets.ALOUD_STORE_PASSWORD }}
        run: |
          if [ -z "$ALOUD_STORE_B64" ] || [ -z "$ALOUD_STORE_PASSWORD" ]; then
            echo "::error::ALOUD_STORE_B64 and ALOUD_STORE_PASSWORD must both be set."
            exit 1
          fi
          mkdir -p "$HOME/.gradle"
          printf '%s' "$ALOUD_STORE_B64" | base64 -d > "$HOME/.gradle/aloud-release.jks"
          echo "aloudReleaseStorePassword=$ALOUD_STORE_PASSWORD" >> "$HOME/.gradle/gradle.properties"
      - name: Build signed release
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Attach APK to the release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/app-release.apk
