# Google Play releases for com.emre.aloud (Wear OS), started by hand (Actions → Play release → Run
# workflow). ci.yml stays as it is: tests on every push, GitHub release APK on a v* tag.
#
# Two jobs, so build code never runs next to the release credentials:
#   build  runs the unit tests and bundleRelease (R8 + resource shrinking). It has NO secrets and NO
#          Play access: it signs with a throwaway key generated on the spot.
#   play   installs nothing. In the protected `production` environment (your approval, `main` only)
#          it re-signs the bundle with the real key using the JDK's own jarsigner, checks the
#          certificate fingerprint, then gets a one-hour Play token from Google through Workload
#          Identity Federation (no key file anywhere) and runs scripts/play/*.sh.
#
# Actions:
#   status              read-only: list the Play tracks and releases (shows which tracks this app has)
#   build-check         build only and keep the throwaway-signed .aab for a day (no secrets, no approval)
#   upload-internal     build, then upload to internal testing
#   promote-production  point production at an already-uploaded versionCode (no build)
#
# Tracks: a Wear OS app can be on Play's standard tracks (internal, production) or on the Wear OS
# form-factor tracks (wear:qa = internal, wear:production). The `tracks` input picks the pair;
# `status` shows which ones the app has.
#
# Version: versionCode / versionName in app/build.gradle.kts; bump them for every upload (Play rejects
# a reused versionCode).
#
# Setup: Google side = pool `github`, provider `aloud-production` (accepts only this repository's id,
# environment `production`, ref main, workflow_dispatch and this workflow file), service account
# `play-ci-aloud` (no keys) invited in Play Console for this app only. GitHub side = environment
# `production` with required reviewer and branch `main`, repository variables GCP_WIF_PROVIDER +
# PLAY_SERVICE_ACCOUNT, and the existing repository secrets ALOUD_STORE_B64 / ALOUD_STORE_PASSWORD
# (~/.gradle/aloud-release.jks, alias aloud, key password = store password), which ci.yml also uses.
name: Play release

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [status, build-check, upload-internal, promote-production]
        default: status
      tracks:
        description: "Track pair: standard (internal / production) or wear (wear:qa / wear:production)"
        type: choice
        options: [standard, wear]
        default: standard
      internal_status:
        description: "upload-internal: release status on the internal track"
        type: choice
        options: [completed, draft]
        default: completed
      version_code:
        description: "promote-production: versionCode already on Play (e.g. 3)"
        type: string
        required: false
      version_name:
        description: "promote-production: its version name (e.g. 0.1.3)"
        type: string
        required: false
      release_notes:
        description: "promote-production: en-US release notes (empty = keep the current ones)"
        type: string
        required: false

permissions: {}

concurrency:
  group: play-release
  cancel-in-progress: false

env:
  PACKAGE: com.emre.aloud
  # Public certificate fingerprint of the release/upload key (~/.gradle/aloud-release.jks).
  UPLOAD_CERT_SHA256: "5A:75:82:00:FF:7A:2C:D2:34:2A:BA:D8:76:3E:56:79:80:2C:1E:05:FB:9B:88:52:22:26:1F:8E:1A:7F:E8:0A"

jobs:
  build:
    if: inputs.action == 'build-check' || inputs.action == 'upload-internal'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version_code: ${{ steps.meta.outputs.version_code }}
      version_name: ${{ steps.meta.outputs.version_name }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The project's own wrapper (Gradle 9.7.1); this only adds caching.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # app/build.gradle.kts reads ~/.gradle/aloud-release.jks (alias aloud) and the
      # aloudReleaseStorePassword property. The play job checks the real key's SHA-256, so a bundle
      # signed with this key can never reach Play.
      - name: Throwaway signing key
        run: |
          umask 077
          mkdir -p "$HOME/.gradle"
          pw=$(openssl rand -hex 16)
          keytool -genkeypair -storetype PKCS12 -keystore "$HOME/.gradle/aloud-release.jks" -storepass "$pw" \
            -keypass "$pw" -alias aloud -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Aloud, OU=CI throwaway' -noprompt
          echo "ORG_GRADLE_PROJECT_aloudReleaseStorePassword=$pw" >> "$GITHUB_ENV"

      - name: Tests and release bundle
        run: ./gradlew :app:testDebugUnitTest :app:bundleRelease --console=plain

      - name: Version and checksum
        id: meta
        run: |
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/app-release.aab"
          {
            echo "version_code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)"
            echo "version_name=$(sed -n 's/^ *versionName = "\([^"]*\)"$/\1/p' app/build.gradle.kts)"
            echo "sha256=$(sha256sum "$RUNNER_TEMP/app-release.aab" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          grep -qE '^version_code=[0-9]+$' "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aab-throwaway-signed
          path: ${{ runner.temp }}/app-release.aab
          retention-days: 1
          if-no-files-found: error

  play:
    needs: build
    # Runs for status/promote (build skipped) and after a successful build; never for build-check.
    if: ${{ !cancelled() && inputs.action != 'build-check' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/play

      - if: inputs.action == 'upload-internal'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aab-throwaway-signed
          path: ${{ runner.temp }}/aab

      - name: Re-sign with the upload key
        if: inputs.action == 'upload-internal'
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          KEYSTORE_B64: ${{ secrets.ALOUD_STORE_B64 }}
          STORE_PW: ${{ secrets.ALOUD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          aab="$RUNNER_TEMP/aab/app-release.aab"
          echo "$EXPECTED_SHA256  $aab" | sha256sum -c -
          JB="${JAVA_HOME_21_X64:?no preinstalled JDK 21 on this runner}/bin"
          ks="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$ks"' EXIT
          printf %s "$KEYSTORE_B64" | base64 -d > "$ks"
          # Remove the throwaway signature (only the JAR-signing files at the bundle root).
          zip -q -d "$aab" 'META-INF/MANIFEST.MF' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA'
          "$JB/jarsigner" -keystore "$ks" -storepass:env STORE_PW -keypass:env STORE_PW \
            -sigalg SHA256withRSA -digestalg SHA-256 "$aab" aloud > /dev/null
          "$JB/jarsigner" -verify "$aab" > "$RUNNER_TEMP/verify.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/verify.txt"
          got=$("$JB/keytool" -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p')
          [ "$got" = "$UPLOAD_CERT_SHA256" ] || { echo "signed with the wrong certificate: $got"; exit 1; }
          echo "signed with the upload key ($UPLOAD_CERT_SHA256)"

      - name: Get a Play token (Workload Identity Federation)
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Run ${{ inputs.action }}
        working-directory: scripts/play
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          ACTION: ${{ inputs.action }}
          TRACKS: ${{ inputs.tracks }}
          INTERNAL_STATUS: ${{ inputs.internal_status }}
          BUILD_CODE: ${{ needs.build.outputs.version_code }}
          BUILD_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          case "$TRACKS" in
            standard) internal=internal; production=production ;;
            wear)     internal=wear:qa;  production=wear:production ;;
            *) echo "unknown tracks $TRACKS"; exit 1 ;;
          esac
          case "$ACTION" in
            status)
              bash ./play-status.sh "$PACKAGE" ;;
            upload-internal)
              bash ./play-upload.sh "$PACKAGE" "$RUNNER_TEMP/aab/app-release.aab" "$internal" \
                "$INTERNAL_STATUS" "$BUILD_CODE ($BUILD_NAME)" ;;
            promote-production)
              [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "version_code must be a number"; exit 1; }
              [[ "$VERSION_NAME" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "version_name looks wrong"; exit 1; }
              bash ./play-production.sh "$PACKAGE" "$VERSION_CODE" "$VERSION_NAME" "$RELEASE_NOTES" "$production" ;;
            *) echo "unknown action $ACTION"; exit 1 ;;
          esac
